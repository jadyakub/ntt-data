<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#062a6f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="TM OT"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>TM OT Record</title><style>:root{--n:#062a6f;--b:#0f4bbb;--o:#ff5b17;--bg:#f4f7fb;--line:#d8e2ef;--ink:#14213d;--mut:#6e7b90;--g:#17875b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.top{position:sticky;top:0;z-index:10;background:linear-gradient(120deg,#041b4e,#0b439f);color:#fff;padding:14px 16px 12px;box-shadow:0 4px 18px #00183b33}.brand{font-weight:900;font-size:18px}.brand small{display:block;font-size:11px;font-weight:500;opacity:.8;margin-top:3px}.main{padding:14px 14px 92px;max-width:900px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px #00183b0b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:24px;color:var(--n)}.stat span{font-size:10px;color:var(--mut);font-weight:700}.section{display:none}.section.on{display:block}.h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 12px}.h h2{font-size:19px;margin:0}.btn{border:0;border-radius:11px;padding:11px 13px;font-weight:800}.blue{background:var(--b);color:#fff}.orange{background:var(--o);color:#fff}.soft{background:#edf3ff;color:var(--n);border:1px solid #d8e5fb}.danger{background:#fff0f0;color:#b93333}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg{display:grid;gap:5px}.fg.full{grid-column:1/-1}.fg label{font-size:11px;font-weight:800;color:#40506a}.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff}.fg textarea{min-height:94px}.photo{border:2px dashed #b9c9e7;border-radius:13px;min-height:170px;display:grid;place-items:center;overflow:hidden;background:#f9fbff;text-align:center;color:var(--mut);font-size:12px}.photo img{width:100%;height:220px;object-fit:cover}.photo input{display:none}.row{border-bottom:1px solid #edf1f6;padding:11px 0}.row:last-child{border-bottom:0}.row-top{display:flex;justify-content:space-between;gap:10px}.row b{font-size:13px}.meta{font-size:11px;color:var(--mut);margin-top:4px;line-height:1.45}.chip{display:inline-block;padding:4px 7px;border-radius:999px;background:#edf4ff;color:var(--b);font-size:10px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.2fr 1fr;z-index:20;padding:max(8px,env(safe-area-inset-bottom)) 8px 8px}.bottom button{border:0;background:transparent;padding:8px 4px;color:#61708a;font-size:11px;font-weight:800}.bottom button strong{display:block;font-size:20px;line-height:1.2}.bottom .new{background:var(--o);color:#fff;border-radius:14px;margin:-18px 5px 0;padding:10px}.slipWrap{overflow:auto;background:#e5ebf3;border-radius:14px;padding:8px}.slip{width:760px;background:#fff;margin:auto;border-radius:10px;overflow:hidden;color:#0b1c3a}.slipHead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e8eef8;padding:16px 18px}.logo{font-size:34px;font-weight:1000;color:#0c43b6;letter-spacing:-4px}.title h1{font-size:19px;margin:0;color:var(--n)}.title b{color:var(--o);font-size:12px}.rec{background:var(--n);color:#fff;padding:10px 14px;border-radius:0 0 0 20px;font-size:10px;line-height:1.6}.slipBody{padding:12px}.box{border:1px solid #d7dfeb;border-radius:8px;overflow:hidden;margin-bottom:8px}.box h3{margin:0;background:linear-gradient(90deg,var(--n),#0e48ac);color:#fff;padding:7px 9px;font-size:10px}.box .c{padding:9px;font-size:10px;line-height:1.65}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.evi{display:grid;grid-template-columns:62% 38%;gap:8px}.evi img{width:100%;height:170px;object-fit:cover}.times{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.time{padding:7px;background:#edf4ff;border-radius:7px;font-weight:800;color:#0c4ab8}.time.out{background:#fff1e9;color:#df591b}.foot{background:linear-gradient(90deg,var(--o) 0 8%,var(--n) 8%);color:#fff;padding:9px 14px;font-size:10px;display:flex;justify-content:space-between}.small{font-size:11px;color:var(--mut)}@media(max-width:620px){.grid{grid-template-columns:1fr}.fg.full{grid-column:auto}.stats{grid-template-columns:repeat(3,1fr)}.stat b{font-size:20px}.main{padding:12px 10px 94px}.top{padding-top:max(14px,env(safe-area-inset-top))}.evi{grid-template-columns:1fr 1fr}}@media print{body{background:#fff}.top,.bottom,.noPrint,.h{display:none!important}.main{padding:0}.section{display:none!important}#slip.section{display:block!important}.slipWrap{padding:0;background:#fff;overflow:visible}.slip{width:100%;box-shadow:none}@page{size:A4 landscape;margin:8mm}}</style></head><body><header class="top"><div class="brand">TM OT Record<small>Mobile Overtime Evidence System</small></div></header><main class="main"><section id="home" class="section on"><div class="h"><h2>Dashboard</h2><button class="btn orange" onclick="newOT()">+ New OT</button></div><div class="stats"><div class="stat"><b id="sRec">0</b><span>RECORDS</span></div><div class="stat"><b id="sHr">0</b><span>TOTAL HOURS</span></div><div class="stat"><b id="sEv">0</b><span>WITH PHOTO</span></div></div><div class="card"><b>Quick use</b><p class="small">Create OT from your phone, capture timestamp photo, save evidence and generate OT slip for upload to the OT system.</p></div><div class="card"><div id="recent"></div></div></section><section id="records" class="section"><div class="h"><h2>OT Records</h2><button class="btn orange" onclick="newOT()">+ New</button></div><div class="card" id="recordList"></div></section><section id="form" class="section"><div class="h"><h2 id="formTitle">New OT</h2><button class="btn soft" onclick="go('records')">Cancel</button></div><div class="card"><div class="grid"><div class="fg"><label>Date</label><input id="fDate" type="date"></div><div class="fg"><label>OT Type</label><select id="fType"><option>Hujung Minggu (Sabtu)</option><option>Hujung Minggu (Ahad)</option><option>Hari Bekerja</option><option>Cuti Umum</option></select></div><div class="fg"><label>Time From</label><div style="display:flex;gap:6px"><input id="fFrom" type="time"><button class="btn soft" onclick="setNow('fFrom')">Now</button></div></div><div class="fg"><label>Time To</label><div style="display:flex;gap:6px"><input id="fTo" type="time"><button class="btn soft" onclick="setNow('fTo')">Now</button></div></div><div class="fg"><label>OT Hours</label><input id="fHours" type="number" step="0.01"></div><div class="fg"><label>Activity</label><input id="fActivity" value="FAULT"></div><div class="fg full"><label>Reference / Ticket</label><input id="fRef" placeholder="Email / NTT / RNTT / project reference"></div><div class="fg"><label>Cost Center</label><input id="fCost" value="WPGA1B"></div><div class="fg"><label>Record No.</label><input id="fNo" placeholder="Optional"></div><div class="fg full"><label>OT Justification / Remark</label><textarea id="fRemark" placeholder="Describe work carried out and reason OT was required"></textarea></div><div class="fg"><label>Timestamp Check-In</label><div style="display:flex;gap:6px"><input id="fIn" type="time"><button class="btn soft" onclick="setNow('fIn')">Now</button></div></div><div class="fg"><label>Timestamp Check-Out</label><div style="display:flex;gap:6px"><input id="fOut" type="time"><button class="btn soft" onclick="setNow('fOut')">Now</button></div></div><div class="fg full"><label>Timestamp / Evidence Photo</label><label class="photo" for="fPhoto"><div id="photoView">📷<br><b>Tap to take/upload photo</b><br>Camera can be used directly from phone</div><input id="fPhoto" type="file" accept="image/*" capture="environment" onchange="loadPhoto(this)"></label></div></div><div class="actions"><button class="btn blue" onclick="saveOT()">Save OT Record</button><button class="btn soft" onclick="saveAndSlip()">Save & View Slip</button></div></div></section><section id="slip" class="section"><div class="h noPrint"><h2>OT Evidence Slip</h2><div><button class="btn soft" onclick="go('records')">Back</button> <button class="btn blue" onclick="window.print()">Print / Save PDF</button></div></div><div class="slipWrap"><div class="slip" id="slipDoc"></div></div></section><section id="profile" class="section"><div class="h"><h2>Profile</h2></div><div class="card"><div class="grid"><div class="fg"><label>Name</label><input id="pName" placeholder="Employee name"></div><div class="fg"><label>Staff No.</label><input id="pStaff"></div><div class="fg"><label>Position</label><input id="pPos" placeholder="Assistant Technical Officer"></div><div class="fg"><label>Department / Unit</label><input id="pDept" placeholder="NFF KGU"></div><div class="fg"><label>Location / Cost Center</label><input id="pLoc" value="WPGA1B"></div><div class="fg"><label>Approver / Supervisor</label><input id="pApp"></div></div><div class="actions"><button class="btn blue" onclick="saveProfile()">Save Profile</button><button class="btn soft" onclick="backup()">Backup Data</button></div></div></section></main><nav class="bottom"><button onclick="go('home')"><strong>⌂</strong>Home</button><button onclick="go('records')"><strong>☷</strong>Records</button><button class="new" onclick="newOT()"><strong>＋</strong>New OT</button><button onclick="go('profile')"><strong>⚙</strong>Profile</button></nav><script>const KEY='tm_ot_pwa_v1';let db=JSON.parse(localStorage.getItem(KEY)||'null')||{records:[],profile:{name:'',staff:'',position:'Assistant Technical Officer',department:'NFF KGU',location:'WPGA1B',approver:''},selected:null};let editId=null,tempPhoto=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function persist(){localStorage.setItem(KEY,JSON.stringify(db));render()}function go(id){document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');if(id==='slip')drawSlip();scrollTo(0,0)}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function hrs(a,b){if(!a||!b)return 0;let [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number),x=bh*60+bm-(ah*60+am);if(x<0)x+=1440;return +(x/60).toFixed(2)}function setNow(id){$(id).value=new Date().toTimeString().slice(0,5);if(id==='fFrom'||id==='fTo')$('fHours').value=hrs($('fFrom').value,$('fTo').value)}$('fFrom').onchange=$('fTo').onchange=()=>$('fHours').value=hrs($('fFrom').value,$('fTo').value);function newOT(){editId=null;tempPhoto=null;$('formTitle').textContent='New OT';['fRef','fNo','fRemark','fIn','fOut'].forEach(i=>$(i).value='');$('fDate').value=new Date().toISOString().slice(0,10);$('fType').value='Hujung Minggu (Sabtu)';$('fFrom').value='';$('fTo').value='';$('fHours').value='';$('fActivity').value='FAULT';$('fCost').value=db.profile.location||'WPGA1B';$('photoView').innerHTML='📷<br><b>Tap to take/upload photo</b><br>Camera can be used directly from phone';go('form')}function editOT(id){let r=db.records.find(x=>x.id===id);if(!r)return;editId=id;tempPhoto=r.photo||null;$('formTitle').textContent='Edit OT';$('fDate').value=r.date;$('fType').value=r.type;$('fFrom').value=r.from;$('fTo').value=r.to;$('fHours').value=r.hours;$('fActivity').value=r.activity;$('fRef').value=r.reference;$('fCost').value=r.cost;$('fNo').value=r.recordNo||'';$('fRemark').value=r.remark;$('fIn').value=r.checkIn||'';$('fOut').value=r.checkOut||'';$('photoView').innerHTML=r.photo?`<img src="${r.photo}">`:'📷<br><b>Tap to take/upload photo</b>';go('form')}function loadPhoto(i){let f=i.files[0];if(!f)return;let rd=new FileReader();rd.onload=e=>{let im=new Image;im.onload=()=>{let c=document.createElement('canvas'),max=1200,s=Math.min(1,max/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);tempPhoto=c.toDataURL('image/jpeg',.78);$('photoView').innerHTML=`<img src="${tempPhoto}">`};im.src=e.target.result};rd.readAsDataURL(f)}function saveOT(){let r={id:editId||uid(),date:$('fDate').value,type:$('fType').value,from:$('fFrom').value,to:$('fTo').value,hours:+$('fHours').value||hrs($('fFrom').value,$('fTo').value),activity:$('fActivity').value,reference:$('fRef').value,cost:$('fCost').value,recordNo:$('fNo').value,remark:$('fRemark').value,checkIn:$('fIn').value,checkOut:$('fOut').value,photo:tempPhoto};if(!r.date){alert('Please select date');return false}let i=db.records.findIndex(x=>x.id===r.id);if(i>=0)db.records[i]=r;else db.records.unshift(r);db.selected=r.id;editId=r.id;persist();return true}function saveAndSlip(){if(saveOT())go('slip')}function delOT(id){if(!confirm('Delete this OT record?'))return;db.records=db.records.filter(x=>x.id!==id);if(db.selected===id)db.selected=db.records[0]?.id||null;persist()}function openSlip(id){db.selected=id;persist();go('slip')}function render(){let total=db.records.reduce((a,r)=>a+(+r.hours||0),0);$('sRec').textContent=db.records.length;$('sHr').textContent=total.toFixed(1);$('sEv').textContent=db.records.filter(r=>r.photo).length;let rows=db.records.map(r=>`<div class="row"><div class="row-top"><b>${esc(r.date)} · ${esc(r.activity||'OT')}</b><span class="chip">${(+r.hours||0).toFixed(2)} h</span></div><div class="meta">${esc(r.from||'-')}–${esc(r.to||'-')} · ${esc(r.reference||'No reference')}<br>${esc((r.remark||'').slice(0,120))}${(r.remark||'').length>120?'…':''}</div><div class="actions"><button class="btn soft" onclick="editOT('${r.id}')">Edit</button><button class="btn blue" onclick="openSlip('${r.id}')">Slip</button><button class="btn danger" onclick="delOT('${r.id}')">Delete</button></div></div>`).join('');$('recordList').innerHTML=rows||'<div class="small">No OT records yet. Tap New OT to start.</div>';$('recent').innerHTML='<b>Recent OT</b>'+(db.records.slice(0,3).map(r=>`<div class="row"><b>${esc(r.date)}</b><div class="meta">${esc(r.remark||r.reference||'OT Record')}</div></div>`).join('')||'<p class="small">No record yet.</p>');loadProfile()}function drawSlip(){let r=db.records.find(x=>x.id===db.selected)||db.records[0];if(!r){$('slipDoc').innerHTML='<div style="padding:30px">No OT record selected.</div>';return}let p=db.profile,month=new Date(r.date+'T00:00').toLocaleDateString('en-MY',{month:'long',year:'numeric'}),photo=r.photo?`<img src="${r.photo}">`:'<div style="height:170px;display:grid;place-items:center;color:#8390a4">No evidence photo</div>';$('slipDoc').innerHTML=`<div class="slipHead"><div style="display:flex;gap:14px;align-items:center"><div class="logo">TM</div><div class="title"><h1>OVERTIME RECORD SLIP</h1><b>${esc(month.toUpperCase())}</b></div></div><div class="rec">RECORD NO: ${esc(r.recordNo||'-')}<br>DATE: ${esc(r.date)}<br>COST CENTER: ${esc(r.cost||p.location||'-')}</div></div><div class="slipBody"><div class="two"><div class="box"><h3>EMPLOYEE INFORMATION</h3><div class="c"><b>Name:</b> ${esc(p.name||'-')}<br><b>Staff No:</b> ${esc(p.staff||'-')}<br><b>Position:</b> ${esc(p.position||'-')}<br><b>Unit:</b> ${esc(p.department||'-')}</div></div><div class="box"><h3>OVERTIME JUSTIFICATION</h3><div class="c"><b>Reference:</b> ${esc(r.reference||'-')}<br><b>Activity:</b> ${esc(r.activity||'-')}<br><b>Type:</b> ${esc(r.type||'-')}<br><b>Remark:</b> ${esc(r.remark||'-')}</div></div></div><div class="evi"><div class="box"><h3>OT TASK & TIME RECORD</h3><div class="c"><b>Date:</b> ${esc(r.date)}<br><b>Time:</b> ${esc(r.from||'-')} to ${esc(r.to||'-')}<br><b>Total OT:</b> ${(+r.hours||0).toFixed(2)} Hours<br><b>Cost Center:</b> ${esc(r.cost||'-')}<hr style="border:0;border-top:1px solid #e4e9f1"><b>Employee Signature:</b> ____________________<br><b>Approver:</b> ${esc(p.approver||'____________________')}</div></div><div class="box"><h3>TIMESTAMP / EVIDENCE</h3><div>${photo}</div><div class="c"><div class="times"><div class="time">IN ${esc(r.checkIn||'-')}</div><div class="time out">OUT ${esc(r.checkOut||'-')}</div></div></div></div></div></div><div class="foot"><span>#UnifiYourWorld</span><span>Trusted · Reliable · Connected</span></div>`}function loadProfile(){let p=db.profile;$('pName').value=p.name||'';$('pStaff').value=p.staff||'';$('pPos').value=p.position||'';$('pDept').value=p.department||'';$('pLoc').value=p.location||'';$('pApp').value=p.approver||''}function saveProfile(){db.profile={name:$('pName').value,staff:$('pStaff').value,position:$('pPos').value,department:$('pDept').value,location:$('pLoc').value,approver:$('pApp').value};persist();alert('Profile saved')}function backup(){let a=document.createElement('a'),b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});a.href=URL.createObjectURL(b);a.download='TM_OT_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click()}render();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
